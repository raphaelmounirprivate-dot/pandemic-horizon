name: Godot tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  simulation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare pinned Godot with checksum verification
        shell: pwsh
        run: ./scripts/setup-godot.ps1
      - name: Import project
        shell: pwsh
        run: ./scripts/dev.ps1 Import
      - name: Test simulation and UI controller
        shell: pwsh
        run: ./scripts/dev.ps1 Test
