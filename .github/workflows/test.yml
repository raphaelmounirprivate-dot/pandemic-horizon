name: Godot tests
on:
  push:
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      # Documents copiés dans le kit joueur par package-windows.ps1
      - 'docs/GUIDE-JOUEUR.md'
      - 'docs/TESTS-JOUEURS.md'
      - 'docs/COMPATIBILITE.md'
      - 'docs/NOTES-VERSION-*.md'
      - 'docs/tests-joueurs/**'
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      # Documents copiés dans le kit joueur par package-windows.ps1
      - 'docs/GUIDE-JOUEUR.md'
      - 'docs/TESTS-JOUEURS.md'
      - 'docs/COMPATIBILITE.md'
      - 'docs/NOTES-VERSION-*.md'
      - 'docs/tests-joueurs/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Sur main : une exécution vérifiée par commit. Ailleurs : annuler les exécutions dépassées.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  simulation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Extracted editor and Windows templates only (~400 MB, not the 1.3 GB .tpz).
      # Official SHA-512 checks run when the entry is created; editing the
      # setup script (e.g. a new Godot version) changes the key.
      - name: Restore verified Godot
        id: godot-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tools/godot
          key: godot-${{ runner.os }}-${{ hashFiles('scripts/setup-godot.ps1') }}
      - name: Prepare pinned Godot with checksum verification
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          ./scripts/setup-godot.ps1 -WithExportTemplates
          Remove-Item .tools/godot/*.zip, .tools/godot/*.tpz
      - name: Import project
        shell: pwsh
        run: ./scripts/dev.ps1 Import
      - name: Test simulation and UI controller
        shell: pwsh
        run: ./scripts/dev.ps1 Test
      - name: Test build identity rejection
        shell: pwsh
        run: ./scripts/test-build-identity.ps1
      - name: Export exact committed candidate
        shell: pwsh
        run: ./scripts/dev.ps1 Export
      - name: Verify and package Windows candidate
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Retain candidate and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-${{ github.sha }}
          path: build/releases/*
          if-no-files-found: error
          # Releases are archived locally (build/releases, checkpoints); CI copies are short-lived.
          retention-days: 14
